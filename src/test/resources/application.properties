# Test configuration using in-memory H2 in MySQL compatibility mode
spring.application.name=expense-tracker-backend-test
spring.datasource.url=jdbc:h2:mem:expensetracker_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

app.cors.allowed-origins=http://localhost:5173

