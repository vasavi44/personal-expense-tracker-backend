# Application configuration
spring.application.name=expense-tracker-backend
server.port=${PORT:8080}

# MySQL Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/expensetracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Actuator & Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS allowed frontend origin
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# JWT Security Configuration
# 256-bit default key for local development; override in production via JWT_SECRET
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

